name: Security

on:
  schedule:
    - cron: "0 3 * * 0"  # Weekly on Sunday at 3 AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e "[dev]"

      - name: Run Safety Check (full)
        run: |
          safety check --full --ignore-normalized-nbext 2>&1 | tee safety-report.txt || true

      - name: Run Bandit Security Scan
        run: |
          bandit -r spam_fraud_detector --exclude tests/ --format json --output bandit-report.json || true
          echo "Bandit scan completed"

      - name: Scan for Vulnerable Dependencies
        uses: anchore/scan-action@v2
        with:
          name: spam-fraud-detector security scan
          path: spam_fraud_detector
          severity-threshold: medium

      - name: Check for Secret Leaks (GitLeaks)
        uses: gitleaks/gitleaks-action@v1
        with:
          api-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Check for Secret Leaks
        uses: github/codeql-action/analyze@v2

      - name: Generate Security Report
        run: |
          echo "=== Security Scan Report ==="
          echo "Python Version: ${{ matrix.python-version }}"
          echo "----------------------------------------"
          if [ -f safety-report.txt ]; then
            echo "Safety Check Results:"
            cat safety-report.txt | head -50
          else
            echo "Safety check completed (no output or errors)"
          fi
          echo "----------------------------------------"
          if [ -f bandit-report.json ]; then
            echo "Bandit Issues Found: $(jq length bandit-report.json)"
            jq -r '.[] | "\(.filename): \(.test_name)"' bandit-report.json | head -20
          else
            echo "Bandit scan completed (no output or errors)"
          fi
          echo "----------------------------------------"
          echo "Dependency vulnerabilities scanned"
          echo "CodeQL analysis completed"
          echo "=== End of Report ==="

      - name: Upload Security Reports
        uses: actions/upload-artifacts@v4
        with:
          name: security-reports-${{ matrix.python-version }}
          path: |
            safety-report.txt
            bandit-report.json
          retention-days: 7

      - name: Fail Workflow on Critical Issues
        if: failure()
        run: |
          echo "⚠️ Security workflow completed with warnings/errors"
          exit 1