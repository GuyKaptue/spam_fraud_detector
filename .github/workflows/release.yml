name: Release

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e "[dev]"

      - name: Build Distribution (sdist)
        run: python setup.py sdist
        env:
          PYTHONPATH: .

      - name: Build Distribution (wheel)
        run: python -m build
        env:
          PYTHONPATH: .

      - name: Verify Distribution
        run: |
          ls -la dist/
          twine check dist/*

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spam-fraud-detector-dist
          path: dist/
          retention-days: 30

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*
          echo "Published to PyPI successfully"

      - name: Create GitHub Release
        uses: softprops/release-action@v1
        with:
          tag_name: ${{ github.release_tag }}
          name: ${{ github.release_name }}
          body: |
            ## Spam & Fraud Detector v${{ github.release_tag }}

            ### Changes
            - Built and tested on Python ${{ matrix.python-version }}
            - All CI checks passed
            - Distribution packages ready for deployment

      - name: Notify Deployment - Slack
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          message: |
            :white_check_mark: Release ${{ github.release_tag }} completed!
            The spam-fraud-detector is now deployed and ready for use.

      - name: Update CHANGELOG
        if: always()
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG already exists"
          else
            echo "# Changelog" > CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "## [[Unreleased]]" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi