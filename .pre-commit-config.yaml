repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict]
  - repo: local
    hooks:
      - id: docs-check-core
        name: core/README.md narrative contract
        entry: python scripts/check_core_readme.py
        language: system
        files: ^spam_fraud_detector/core/(README\.md|.+\.py)$
        pass_filenames: false